# Robô diário do Radar Serra Negra.
# Todo dia às 4h17 (horário de Brasília) ele coleta os dados de novo na API de Dados Abertos
# da Câmara de Serra Negra e republica o site. Se a coleta vier incompleta ou estranha, o coletor
# para com erro, nada é publicado e o site fica com a última versão boa.
#
# O token da API fica no Secret CLAN_TOKEN do repositório
# (Settings → Secrets and variables → Actions → New repository secret). Nunca no código.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 7 * * *"  # 04:17 em Brasília; evita o início da hora
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-serranegra
  cancel-in-progress: false

jobs:
  coletar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Coletar dados na Câmara
        env:
          CLAN_TOKEN: ${{ secrets.CLAN_TOKEN }}
        run: |
          pip install pillow
          python coletor/coletar.py
          python coletor/prefeitura.py || echo "TCE-SP fora do ar; a página da Prefeitura fica com os dados de ontem"
          python coletor/paginas.py
      - name: Guardar os dados novos no repositório
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add site coletor/cache_tce.json
          git diff --cached --quiet || git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
          git push origin HEAD:refs/heads/main
      - name: Conferir revisão antes de publicar
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
